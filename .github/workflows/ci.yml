name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Travel Web (Vite)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # version 省略时 action-setup 自动读 package.json 的 packageManager（单一真源）
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm

      - name: install
        run: pnpm install --frozen-lockfile
      - name: typecheck
        run: pnpm run typecheck
      - name: unit tests
        run: pnpm run test
      - name: production build
        run: pnpm run build
