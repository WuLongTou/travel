<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>宇宙航行 · 游戏式可交互宇宙</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
</head>
<body>
  <canvas id="scene"></canvas>

  <!-- 顶栏：当前尺度面包屑 + 光速尺 -->
  <header class="topbar" id="topbar">
    <div class="crumb" id="crumb"></div>
    <div class="ruler" id="ruler"></div>
  </header>

  <!-- 底部控制台：尺度导航 / 时间倍率 / 操作提示 -->
  <div class="dock" id="dock">
    <div class="dock-nav">
      <div class="dock-title">宇宙尺度</div>
      <div class="nav-buttons" id="nav-buttons"></div>
    </div>
    <div class="dock-time">
      <div class="dock-title">时间</div>
      <div class="time-buttons" id="time-buttons"></div>
    </div>
    <div class="dock-help" id="dock-help"></div>
  </div>

  <!-- 目标信息卡 -->
  <aside class="infocard hidden" id="infocard">
    <div class="info-head">
      <span class="info-title" id="info-title">—</span>
      <span class="info-schematic hidden" id="info-schematic">示意</span>
      <button class="info-close" id="info-close" title="关闭">✕</button>
    </div>
    <div class="info-sub" id="info-sub"></div>
    <dl class="info-facts" id="info-facts"></dl>
    <div class="info-text" id="info-text"></div>
    <div class="info-actions" id="info-actions"></div>
  </aside>

  <!-- 屏幕准星：游戏式瞄准/拾取指示，命中目标时高亮 -->
  <div class="crosshair" id="crosshair"><span></span></div>

  <!-- 左下 HUD -->
  <div class="hud" id="hud">
    <div class="hud-row"><span class="hud-k">速度</span><span class="hud-v" id="hud-speed">—</span></div>
    <div class="hud-row"><span class="hud-k">距选择</span><span class="hud-v" id="hud-dist">—</span></div>
    <div class="hud-row"><span class="hud-k">模拟钟</span><span class="hud-v" id="hud-clock">—</span></div>
    <div class="hud-row"><span class="hud-k">模式</span><span class="hud-v" id="hud-mode">巡航</span></div>
  </div>

  <!-- 下潜提示 -->
  <div class="dive-hint hidden" id="dive-hint">
    <div class="dive-text" id="dive-text"></div>
    <button id="btn-dive">下潜（F）</button>
  </div>

  <!-- 层介绍卡：进入新尺度时的教育导览 -->
  <div class="world-intro hidden" id="world-intro">
    <div class="intro-title" id="intro-title"></div>
    <div class="intro-text" id="intro-text"></div>
  </div>

  <!-- 全屏转场遮罩 -->
  <div class="fade hidden" id="fade"></div>

  <!-- 加载提示 -->
  <div class="loading hidden" id="loading">载入宇宙…</div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
