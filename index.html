<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>宇宙航行 · 飞行器模拟</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
</head>
<body>
  <canvas id="scene"></canvas>

  <!-- 顶栏：当前尺度面包屑 -->
  <header class="topbar" id="topbar">
    <div class="crumb" id="crumb"></div>
  </header>

  <!-- 层介绍横幅：进入新尺度层时短暂展示该层教学文案 -->
  <div class="layer-intro" id="layer-intro"></div>

  <!-- 目标信息卡 -->
  <aside class="infocard hidden" id="infocard">
    <div class="info-head">
      <span class="info-title" id="info-title">—</span>
      <span class="info-schematic hidden" id="info-schematic">示意</span>
      <button class="info-close" id="info-close" title="关闭">✕</button>
    </div>
    <div class="info-sub" id="info-sub"></div>
    <dl class="info-facts" id="info-facts"></dl>
    <div class="info-text" id="info-text"></div>
    <div class="info-actions" id="info-actions"></div>
  </aside>

  <!-- 屏幕准星：游戏式瞄准/拾取指示，命中目标时高亮 -->
  <div class="crosshair" id="crosshair"><span></span></div>

  <!-- 座舱框：仅座舱视角显示的机身遮蔽（四周暗角 + 底部仪表台剪影） -->
  <div class="cockpit-frame hidden" id="cockpit-frame"></div>

  <!-- HUD 飞行仪表 -->
  <div class="hud" id="hud">
    <div class="hud-row"><span class="hud-k">速度</span><span class="hud-v" id="hud-speed">—</span></div>
    <div class="hud-row"><span class="hud-k">距选择</span><span class="hud-v" id="hud-dist">—</span></div>
    <div class="hud-row"><span class="hud-k">模式</span><span class="hud-v" id="hud-mode">巡航</span></div>
    <div class="hud-row hud-sep"></div>
    <div class="hud-row"><span class="hud-k">时间</span><span class="hud-v" id="hud-clock">—</span></div>
    <div class="hud-row"><span class="hud-k">倍率</span><span class="hud-v" id="hud-rate">实时</span></div>
    <div class="hud-row"><span class="hud-k">尺度</span><span class="hud-v" id="hud-scale">—</span></div>
  </div>

  <!-- 操控提示：首次进入短暂显示后自动消失 -->
  <div class="controls-hint" id="controls-hint">
    <div class="hint-title">操控</div>
    <div class="hint-grid">
      <span class="hint-key">W S A D</span><span>手动飞行</span>
      <span class="hint-key">松开按键</span><span>全自动航行</span>
      <span class="hint-key">点击天体</span><span>自动导向泊车</span>
      <span class="hint-key">F</span><span>下潜进入选中天体</span>
      <span class="hint-key">顶栏</span><span>直达六层尺度（飞出层界自动浮升）</span>
      <span class="hint-key">鼠标移动</span><span>环视观察（不干扰航向）</span>
      <span class="hint-key">右键拖拽</span><span>平移视角</span>
      <span class="hint-key">滚轮</span><span>无限缩放</span>
      <span class="hint-key">Z / 双击</span><span>视角复位</span>
      <span class="hint-key">Q E</span><span>横滚机身</span>
      <span class="hint-key">Shift</span><span>引擎加力</span>
      <span class="hint-key">X</span><span>反推刹车</span>
      <span class="hint-key">V</span><span>切换视角</span>
      <span class="hint-key">G</span><span>上帝视角</span>
      <span class="hint-key">T</span><span>大巡游</span>
      <span class="hint-key">R</span><span>安全重置</span>
      <span class="hint-key">[ ]</span><span>时间倍率（巡航自动调节）</span>
      <span class="hint-key">\</span><span>时钟暂停</span>
      <span class="hint-key">Tab</span><span>显示帮助</span>
    </div>
  </div>

  <!-- 全屏转场遮罩 -->
  <div class="fade hidden" id="fade"></div>

  <!-- 加载提示 -->
  <div class="loading hidden" id="loading">载入宇宙…</div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
